<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasir Warung"><meta name="theme-color" content="#0e6b5c">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Kasir Warung</title>
<style>
:root{--bg:#f1f4f1;--card:#fff;--tx:#18211d;--mu:#66726b;--ac:#0e6b5c;--ac2:#dcefe9;--bd:#dde3de;--rd:#c23a2b;--am:#b86e00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b221f;--tx:#eaf0ec;--mu:#97a39c;--ac:#3dd1b0;--ac2:#1a3a33;--bd:#2b3430;--rd:#ff7566;--am:#f2b04a}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b221f;--tx:#eaf0ec;--mu:#97a39c;--ac:#3dd1b0;--ac2:#1a3a33;--bd:#2b3430;--rd:#ff7566;--am:#f2b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
#app{max-width:560px;margin:auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}h3{margin:14px 0 6px;font-size:15px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
label{display:block;font-size:13px;color:var(--mu)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--bg);cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
button.s,.btn.s{background:var(--ac2);color:var(--ac)}button.r{background:var(--rd);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pc{background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:left;padding:8px;position:relative}
.th{width:44px;height:44px;border-radius:8px;background:var(--ac2);display:grid;place-items:center;overflow:hidden;flex:none;font-size:22px;margin-bottom:4px}.th img{width:100%;height:100%;object-fit:cover}
.row .th{margin:0}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px;margin:6px 0}
.g{flex:1;min-width:0}small{color:var(--mu)}.bad{color:var(--rd);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{display:flex;gap:6px;margin:6px 0}.seg>*{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi b{display:block;font-size:17px}
.bg2{position:absolute;top:6px;right:6px;background:var(--ac);color:var(--bg);border-radius:99px;padding:0 8px;font-weight:700}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;background:none;color:var(--mu);border-radius:0;display:flex;flex-direction:column;align-items:center;padding:8px 2px;font-size:20px}#nav small{font-size:11px;color:inherit}#nav .on{color:var(--ac)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mb{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
canvas{width:140px;height:140px;border-radius:10px;border:1px solid var(--bd);display:block;margin:6px 0}
pre{white-space:pre-wrap;font:13px ui-monospace,monospace}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;display:none;z-index:20}
</style></head><body>
<div id="app"></div><div id="md"></div><div id="ts"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const L='kasir|stok|kasbon|laporan|setelan|search|cart|empty|buyer|cash|credit|paid|change|total|save|short|needname|add|name|buy|sell|stock|min|photo|rotate|bright|contrast|zoom|del|day|week|month|revenue|cogs|profit|trx|cashin|newcredit|repaid|top|low|shop|lang|backup|restore|pay|remind|close|share|amount|none|margin|receipt|remain|confirm|ok|bad'.split('|');
const T={id:'Kasir|Stok|Kasbon|Laporan|Setelan|Cari produk…|Keranjang|Belum ada produk. Tambah di menu Stok.|Nama pembeli|Cash|Kasbon|Uang diterima|Kembalian|Total|Simpan transaksi|Uang kurang dari total|Isi nama pembeli untuk kasbon|+ Produk|Nama produk|Harga beli|Harga jual|Stok|Stok minimum|Foto|Putar|Kecerahan|Kontras|Zoom|Hapus|Harian|Mingguan|Bulanan|Omzet|Modal|Laba|Transaksi|Cash masuk|Kasbon baru|Kasbon dibayar|Terlaris|Stok menipis|Nama warung|Bahasa|Backup|Restore|Bayar|Tagih WA|Tutup|Kirim WA|Jumlah bayar|Tidak ada|Untung|Struk|Sisa kasbon|Yakin hapus produk ini?|Data dipulihkan|Data tidak valid'.split('|'),
en:'Cashier|Stock|Credit|Reports|Settings|Search product…|Cart|No products yet. Add them in Stock.|Customer name|Cash|On credit|Cash received|Change|Total|Save sale|Cash is less than total|Enter customer name for credit|+ Product|Product name|Cost price|Selling price|Stock|Min stock|Photo|Rotate|Brightness|Contrast|Zoom|Delete|Daily|Weekly|Monthly|Revenue|Cost|Profit|Sales|Cash in|New credit|Credit repaid|Top sellers|Low stock|Shop name|Language|Backup|Restore|Pay|Remind via WA|Close|Send WA|Amount paid|None|Margin|Receipt|Credit left|Sure delete this product?|Data restored|Invalid data'.split('|')};
let db={products:[],sales:[],pays:[],lang:'id',shop:'Warung Saya'};
try{const s=localStorage.getItem('kasir');if(s)Object.assign(db,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem('kasir',JSON.stringify(db))}catch(e){toast('Storage full')}};
const t=k=>(T[db.lang]||T.id)[L.indexOf(k)]||k;
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const pr=id=>db.products.find(p=>p.id===id);
let tab='kasir',cart={},q='',rng='d',rdate=ymd(Date.now()),method='cash',buyer='',paid='',ed={};
function toast(m){const e=$('#ts');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function modal(h){$('#md').innerHTML=h?`<div class=ov onclick="if(event.target===this)modal()"><div class=mb>${h}</div></div>`:''}
const total=()=>Object.entries(cart).reduce((a,[id,n])=>{const p=pr(id);return a+(p?p.sell*n:0)},0);
function render(){
 const v={kasir:v_kasir,stok:v_stok,kasbon:v_kasbon,laporan:v_laporan,setelan:v_setelan}[tab]();
 $('#app').innerHTML=`<h1>${esc(db.shop)}</h1>`+v;
 $('#nav').innerHTML=[['kasir','🛒'],['stok','📦'],['kasbon','📒'],['laporan','📊'],['setelan','⚙️']].map(([k,i])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${i}<small>${t(k)}</small></button>`).join('');
 if(tab==='kasir')grid()}
function grid(){const g=$('#grid');if(!g)return;const f=db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
 g.innerHTML=f.map(p=>`<button class=pc onclick="ch('${p.id}',1)"><div class=th>${p.img?`<img src="${p.img}">`:'📦'}</div><b>${esc(p.name)}</b><br><small>${rp(p.sell)} · ${t('stock')} ${p.stock}</small>${cart[p.id]?`<span class=bg2>${cart[p.id]}</span>`:''}</button>`).join('')}
function ch(id,d){const p=pr(id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n>p.stock){toast(t('stock')+': '+p.stock);return}else cart[id]=n;render()}
function info(){const tot=total(),pd=+paid||0;
 if(method==='cash')return paid?(pd>=tot?`${t('change')}: <b>${rp(pd-tot)}</b>`:`<span class=bad>${t('short')}</span>`):`<small>${t('cash')}</small>`;
 return `${t('remain')}: <b style="color:var(--am)">${rp(tot-Math.min(pd,tot))}</b>`}
function v_kasir(){const its=Object.keys(cart).filter(pr),names=[...new Set(db.sales.map(s=>s.buyer).filter(Boolean))];
 return `<input id=sq placeholder="${t('search')}" value="${esc(q)}" oninput="q=this.value;grid()"><div id=grid class=grid></div>
<h3>${t('cart')}</h3>${its.length?its.map(id=>{const p=pr(id);return `<div class=row><div class=g><b>${esc(p.name)}</b><br><small>${rp(p.sell)}</small></div><button class=s onclick="ch('${id}',-1)">−</button><b>${cart[id]}</b><button class=s onclick="ch('${id}',1)">+</button></div>`}).join(''):`<small>${db.products.length?'—':t('empty')}</small>`}
<h3>${t('total')}: ${rp(total())}</h3>
<input list=bn placeholder="${t('buyer')}" value="${esc(buyer)}" oninput="buyer=this.value"><datalist id=bn>${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<div class=seg><button class="${method=='cash'?'':'s'}" onclick="method='cash';render()">${t('cash')}</button><button class="${method=='kasbon'?'':'s'}" onclick="method='kasbon';render()">${t('credit')}</button></div>
<input type=number inputmode=numeric placeholder="${t('paid')}" value="${paid}" oninput="paid=this.value;$('#info').innerHTML=info()">
<div class=seg><button class=s onclick="paid=String(total());render()">= ${t('total')}</button></div>
<div id=info class=card>${info()}</div><br><button style="width:100%" onclick="done()">${t('save')}</button>`}
function done(){const items=Object.keys(cart).filter(pr).map(id=>{const p=pr(id);return{id,name:p.name,q:cart[id],buy:p.buy,sell:p.sell}});if(!items.length)return;
 const tot=sum(items,i=>i.q*i.sell);let pd=paid===''?(method==='cash'?tot:0):+paid;
 const s={id:uid(),t:Date.now(),buyer:buyer.trim(),items,total:tot,method,paid:0,debt:0,given:pd,change:0};
 if(method==='cash'){if(pd<tot){toast(t('short'));return}s.paid=tot;s.change=pd-tot}
 else{if(!s.buyer){toast(t('needname'));return}s.paid=Math.min(pd,tot);s.debt=tot-s.paid;s.given=s.paid}
 items.forEach(i=>{pr(i.id).stock-=i.q});db.sales.push(s);save();cart={};paid='';buyer='';render();showReceipt(s)}
function showReceipt(s){const x=[db.shop,new Date(s.t).toLocaleString(),s.buyer?t('buyer')+': '+s.buyer:null,'',...s.items.map(i=>`${i.name} ${i.q} x ${rp(i.sell)} = ${rp(i.q*i.sell)}`),'',t('total')+': '+rp(s.total)];
 if(s.debt>0)x.push(t('paid')+': '+rp(s.paid),t('remain')+': '+rp(s.debt));else x.push(t('paid')+': '+rp(s.given),t('change')+': '+rp(s.change));
 const txt=x.filter(v=>v!==null).join('\n');
 modal(`<h3>${t('receipt')}</h3><pre>${esc(txt)}</pre><div class=seg><a class=btn target=_blank rel=noopener href="https://wa.me/?text=${encodeURIComponent(txt)}">${t('share')}</a><button class=s onclick="modal()">${t('close')}</button></div>`)}
function v_stok(){return `<button style="width:100%" onclick="edit()">${t('add')}</button>`+db.products.map(p=>`<div class=row onclick="edit('${p.id}')"><div class=th>${p.img?`<img src="${p.img}">`:'📦'}</div><div class=g><b>${esc(p.name)}</b><br><small>${rp(p.buy)} → ${rp(p.sell)} · ${t('margin')} ${rp(p.sell-p.buy)}</small></div><b class="${p.stock<=p.min?'bad':''}">${p.stock}</b></div>`).join('')}
function edit(id){const p=id?pr(id):null;ed={id:id||'',src:null,rot:0,z:100,br:0,ct:0};
 modal(`<h3>${p?esc(p.name):t('add')}</h3><label>${t('name')}<input id=pn value="${p?esc(p.name):''}"></label>
<div class=two><label>${t('buy')}<input id=pb type=number inputmode=numeric value="${p?p.buy:''}"></label><label>${t('sell')}<input id=ps type=number inputmode=numeric value="${p?p.sell:''}"></label></div>
<div class=two><label>${t('stock')}<input id=pt type=number inputmode=numeric value="${p?p.stock:''}"></label><label>${t('min')}<input id=pm type=number inputmode=numeric value="${p?p.min:''}"></label></div>
<label>${t('photo')}<input type=file accept="image/*" onchange="pick(this)"></label><canvas id=cv width=200 height=200></canvas>
<div class=two><label>${t('zoom')}<input type=range min=100 max=300 value=100 oninput="ed.z=+this.value;draw()"></label><label>${t('bright')}<input type=range min=-60 max=60 value=0 oninput="ed.br=+this.value;draw()"></label></div>
<div class=two><label>${t('contrast')}<input type=range min=-50 max=50 value=0 oninput="ed.ct=+this.value;draw()"></label><button class=s onclick="ed.rot=(ed.rot+1)%4;draw()">↻ ${t('rotate')}</button></div>
<div class=seg><button onclick="saveP()">${t('save').split(' ')[0]}</button>${p?`<button class=r onclick="if(this.dataset.s)delP();else{this.dataset.s=1;this.textContent=t('confirm')}">${t('del')}</button>`:''}<button class=s onclick="modal()">${t('close')}</button></div>`);
 if(p&&p.img){const im=new Image();im.onload=()=>{ed.src=im;draw()};im.src=p.img}}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{ed.src=im;ed.rot=0;draw()};im.src=r.result};r.readAsDataURL(f)}
function draw(){const c=$('#cv');if(!c||!ed.src)return;const x=c.getContext('2d'),S=200,im=ed.src;x.save();x.fillStyle='#fff';x.fillRect(0,0,S,S);x.translate(S/2,S/2);x.rotate(ed.rot*Math.PI/2);
 const m=Math.min(im.width,im.height)/(ed.z/100),sx=(im.width-m)/2,sy=(im.height-m)/2;x.drawImage(im,sx,sy,m,m,-S/2,-S/2,S,S);x.restore();
 const d=x.getImageData(0,0,S,S),p=d.data,k=1+ed.ct/100;for(let i=0;i<p.length;i+=4)for(let j=0;j<3;j++)p[i+j]=(p[i+j]-128)*k+128+ed.br;x.putImageData(d,0,0)}
function saveP(){const n=$('#pn').value.trim();if(!n)return;
 const o={id:ed.id||uid(),name:n,buy:+$('#pb').value||0,sell:+$('#ps').value||0,stock:+$('#pt').value||0,min:+$('#pm').value||0,img:ed.src?$('#cv').toDataURL('image/jpeg',.7):''};
 const i=db.products.findIndex(p=>p.id===o.id);if(i<0)db.products.push(o);else db.products[i]=o;save();modal();render()}
function delP(){db.products=db.products.filter(p=>p.id!==ed.id);save();modal();render()}
function debts(){const m={};db.sales.forEach(s=>{if(s.debt>0){const k=s.buyer.toLowerCase();(m[k]=m[k]||{n:s.buyer,d:0}).d+=s.debt}});db.pays.forEach(p=>{const k=p.buyer.toLowerCase();if(m[k])m[k].d-=p.amt});return Object.values(m).filter(x=>x.d>0)}
function v_kasbon(){const D=debts();return `<h3>${t('kasbon')}: <span class=bad>${rp(sum(D,x=>x.d))}</span></h3>`+(D.length?D.map((x,i)=>`<div class=row><div class=g><b>${esc(x.n)}</b><br><span class=bad>${rp(x.d)}</span></div><a class="btn s" target=_blank rel=noopener href="https://wa.me/?text=${encodeURIComponent(db.shop+' — '+x.n+': '+t('remain')+' '+rp(x.d))}">WA</a><button onclick="payM(${i})">${t('pay')}</button></div>`).join(''):`<small>${t('none')}</small>`)}
function payM(i){const x=debts()[i];modal(`<h3>${esc(x.n)} — ${rp(x.d)}</h3><input id=pa type=number inputmode=numeric value="${Math.round(x.d)}" placeholder="${t('amount')}"><div class=seg><button onclick="payD(${i})">${t('pay')}</button><button class=s onclick="modal()">${t('close')}</button></div>`)}
function payD(i){const x=debts()[i],v=+$('#pa').value;if(!v||v<=0)return;db.pays.push({id:uid(),t:Date.now(),buyer:x.n,amt:Math.min(v,x.d)});save();modal();render()}
function span(){const d=new Date(rdate+'T00:00:00');let a=new Date(d),b;
 if(rng==='w'){a.setDate(d.getDate()-((d.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+7)}
 else if(rng==='m'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,1)}
 else{b=new Date(d);b.setDate(d.getDate()+1)}return[+a,+b]}
function v_laporan(){const[a,b]=span(),S=db.sales.filter(s=>s.t>=a&&s.t<b),P=db.pays.filter(p=>p.t>=a&&p.t<b);
 const rev=sum(S,s=>s.total),cogs=sum(S,s=>sum(s.items,i=>i.q*i.buy)),rep=sum(P,p=>p.amt),k=(l,v)=>`<div class="card kpi"><small>${t(l)}</small><b>${v}</b></div>`;
 const tp={};S.forEach(s=>s.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.q));const top=Object.entries(tp).sort((x,y)=>y[1]-x[1]).slice(0,5),low=db.products.filter(p=>p.stock<=p.min);
 return `<div class=seg>${[['d','day'],['w','week'],['m','month']].map(([r,l])=>`<button class="${rng==r?'':'s'}" onclick="rng='${r}';render()">${t(l)}</button>`).join('')}</div>
<input type=date value="${rdate}" onchange="rdate=this.value||rdate;render()">
<div class=two>${k('revenue',rp(rev))}${k('cogs',rp(cogs))}${k('profit',rp(rev-cogs))}${k('trx',S.length)}${k('cashin',rp(sum(S,s=>s.paid)+rep))}${k('newcredit',rp(sum(S,s=>s.debt)))}${k('repaid',rp(rep))}</div>
<h3>${t('top')}</h3>${top.length?top.map(([n,c])=>`<div class=row><div class=g>${esc(n)}</div><b>${c}</b></div>`).join(''):`<small>${t('none')}</small>`}
<h3>${t('low')}</h3>${low.length?low.map(p=>`<div class=row><div class=g>${esc(p.name)}</div><b class=bad>${p.stock}</b></div>`).join(''):`<small>${t('none')}</small>`}`}
function v_setelan(){return `<label>${t('shop')}<input value="${esc(db.shop)}" onchange="db.shop=this.value;save();render()"></label>
<label>${t('lang')}<select onchange="db.lang=this.value;save();render()"><option value=id ${db.lang=='id'?'selected':''}>Bahasa Indonesia</option><option value=en ${db.lang=='en'?'selected':''}>English</option></select></label>
<h3>${t('backup')} / ${t('restore')}</h3><textarea id=bk rows=5></textarea><div class=seg><button class=s onclick="bk()">${t('backup')}</button><button onclick="rs()">${t('restore')}</button></div>`}
function bk(){const e=$('#bk');e.value=JSON.stringify(db);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}}
function rs(){try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.products))throw 0;Object.assign(db,o);save();render();toast(t('ok'))}catch(e){toast(t('bad'))}}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
