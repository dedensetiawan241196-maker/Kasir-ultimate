<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1412"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kasir Ultimate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kasir Ultimate</title>
<style>
:root{--bg:#0f1412;--card:#171e1b;--card2:#1d2622;--tx:#eef5f1;--mu:#94a39b;--ac:#27c99b;--ac2:#173c32;--bd:#29352f;--red:#ff6b61;--amber:#f0ad45;--blue:#63a4ff;--shadow:0 10px 30px #0006}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:86px}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:10px 13px;background:var(--ac);color:#07110d;font-weight:700;cursor:pointer}button.secondary{background:var(--ac2);color:var(--ac)}button.danger{background:var(--red);color:#fff}button.warn{background:var(--amber);color:#1d1304}button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:10px 11px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:10px;background:#111714;color:var(--tx);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}label{display:block;color:var(--mu);font-size:12px}.wrap{max-width:720px;margin:auto;padding:12px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--ac2);display:grid;place-items:center;font-size:23px}.top .g{flex:1}.top h1{margin:0;font-size:19px}.top small{color:var(--mu)}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:12px;margin:9px 0;box-shadow:0 4px 18px #0002}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px}.kpi small{color:var(--mu)}.kpi b{display:block;font-size:17px;margin-top:2px}.row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:9px;margin:7px 0}.g{flex:1;min-width:0}.muted{color:var(--mu)}.bad{color:var(--red)}.good{color:var(--ac)}.warntext{color:var(--amber)}.small{font-size:12px}.pill{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:3px 8px;color:var(--mu);font-size:11px}.tabs{display:flex;gap:6px;overflow:auto;margin:7px 0}.tabs button{white-space:nowrap}.tabs .active{background:var(--ac2);color:var(--ac)}.product{position:relative;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px;border-radius:13px;min-height:105px}.product .pic{height:45px;width:45px;border-radius:10px;background:var(--ac2);display:grid;place-items:center;overflow:hidden;font-size:22px;margin-bottom:6px}.product img{width:100%;height:100%;object-fit:cover}.qty{display:flex;align-items:center;gap:5px}.qty button{padding:5px 9px}.badge{position:absolute;top:7px;right:7px;border-radius:99px;background:var(--ac);color:#06100c;padding:2px 7px;font-weight:800}.bottom{position:fixed;z-index:8;left:0;right:0;bottom:0;background:#121815ee;backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}.bottom nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.bottom button{background:transparent;color:var(--mu);border-radius:0;padding:7px 2px;font-size:18px}.bottom button.on{color:var(--ac)}.bottom small{display:block;font-size:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.right{text-align:right}.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:720px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px;box-shadow:var(--shadow)}.closex{float:right;background:transparent;color:var(--mu);font-size:22px;padding:0}.toast{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 15px;border-radius:99px;display:none;box-shadow:var(--shadow)}.empty{padding:20px;text-align:center;color:var(--mu)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left}pre{white-space:pre-wrap}.pin{font-size:28px;text-align:center;letter-spacing:8px}.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.lockbox{width:100%;max-width:360px}.hidden{display:none!important}@media(min-width:600px){body{padding-bottom:20px}.bottom{position:static;border:0;background:transparent}.bottom nav{border:1px solid var(--bd);border-radius:14px;margin:12px auto;background:var(--card)}.bottom button{padding:9px}.wrap{padding-bottom:10px}}
</style></head>
<body>
<div id="lock" class="lock hidden"><div class="lockbox card"><div style="text-align:center;font-size:40px">🔐</div><h2 style="text-align:center;margin:6px 0">Kasir Ultimate</h2><p class="muted" style="text-align:center">Masukkan PIN untuk membuka aplikasi</p><input id="pinIn" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><button style="width:100%" onclick="unlock()">Buka</button><p id="pinErr" class="bad" style="text-align:center"></p></div></div>
<div id="app" class="wrap"></div><div id="toast" class="toast"></div><div id="modal"></div>
<div class="bottom"><nav id="nav"></nav></div>
<script>
'use strict';
const KEY='kasir_ultimate_v1';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8); const rp=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');
const now=()=>Date.now(), ymd=t=>{let d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const base={products:[],sales:[],pays:[],moves:[],kas:[],shop:'Warung Saya',lang:'id',pin:'1234',settings:{dark:true,lockMinutes:0},created:now()};
let db=load(), tab='kasir',cart={},search='',method='cash',buyer='',discount=0,paid='',reportRange='day',historyFilter='all',historySearch='';
function normalize(o){o=o&&typeof o==='object'?o:{};return {products:Array.isArray(o.products)?o.products.map(p=>({...p,id:String(p.id||uid()),name:String(p.name||'').trim(),buy:+p.buy||0,sell:+p.sell||0,stock:Math.max(0,+p.stock||0),min:Math.max(0,+p.min||0),category:String(p.category||'Umum'),barcode:String(p.barcode||''),unit:String(p.unit||'pcs'),supplier:String(p.supplier||''),img:typeof p.img==='string'?p.img:''})).filter(p=>p.name):[],sales:Array.isArray(o.sales)?o.sales:[],pays:Array.isArray(o.pays)?o.pays:[],moves:Array.isArray(o.moves)?o.moves:[],kas:Array.isArray(o.kas)?o.kas:[],shop:String(o.shop||'Warung Saya'),lang:o.lang==='en'?'en':'id',pin:String(o.pin||'1234'),settings:{dark:o.settings?.dark!==false,lockMinutes:Math.max(0,+o.settings?.lockMinutes||0)},created:+o.created||now()}}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null')||base)}catch(e){return normalize(base)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Penyimpanan gagal / penuh');return false}}
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2400)}
function product(id){return db.products.find(p=>p.id===id)}
function totals(){let sub=Object.entries(cart).reduce((a,[id,q])=>a+(product(id)?.sell||0)*q,0);let disc=Math.min(sub,Math.max(0,+discount||0));return {sub,disc,total:sub-disc}}
function debtOf(name){let k=String(name||'').trim().toLowerCase();if(!k)return 0;return db.sales.filter(s=>String(s.buyer||'').trim().toLowerCase()===k&&s.method==='credit'&&!s.cancelled).reduce((a,s)=>a+(+s.debt||0),0)-db.pays.filter(p=>String(p.buyer||'').trim().toLowerCase()===k).reduce((a,p)=>a+(+p.amt||0),0)}
function render(){let v={kasir:kasir,stok:stok,kasbon:kasbon,riwayat:riwayat,laporan:laporan,setelan:setelan}[tab]();$('#app').innerHTML=`<div class="top"><div class="logo">🧾</div><div class="g"><h1>${esc(db.shop)}</h1><small>Kasir Ultimate · offline</small></div><button class="secondary" onclick="quickLock()">🔒</button></div>`+v;nav();if(tab==='kasir')drawProducts()}
function nav(){let items=[['kasir','🛒','Kasir'],['stok','📦','Stok'],['kasbon','📒','Kasbon'],['riwayat','🧾','Riwayat'],['laporan','📊','Laporan'],['setelan','⚙️','Setelan']];$('#nav').innerHTML=items.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}<small>${x[2]}</small></button>`).join('')}
function kasir(){let t=totals();return `<div class="card"><div class="two"><div><label>Barcode / cari produk</label><input id="search" value="${esc(search)}" placeholder="Nama atau barcode" oninput="search=this.value;drawProducts()" onkeydown="if(event.key==='Enter')scanEnter()"></div><div><label>Mode</label><select onchange="method=this.value;render()"><option value="cash" ${method==='cash'?'selected':''}>Cash</option><option value="credit" ${method==='credit'?'selected':''}>Kasbon</option></select></div></div><div id="products" class="grid"></div></div><div class="card"><b>Keranjang</b>${Object.keys(cart).length?Object.entries(cart).map(([id,q])=>{let p=product(id);return `<div class="row"><div class="g"><b>${esc(p.name)}</b><br><span class="muted">${q} ${esc(p.unit)} × ${rp(p.sell)}</span></div><div class="qty"><button class="secondary" onclick="changeQty('${id}',-1)">−</button><b>${q}</b><button class="secondary" onclick="changeQty('${id}',1)">+</button></div><b>${rp(q*p.sell)}</b></div>`}).join(''):'<div class="empty">Belum ada produk di keranjang.</div>'}<div class="two"><div><label>Nama pembeli ${method==='credit'?'(wajib)':''}</label><input value="${esc(buyer)}" oninput="buyer=this.value"></div><div><label>Diskon (Rp)</label><input type="number" min="0" value="${discount||''}" oninput="discount=this.value;render()"></div></div><div class="grid3"><div class="kpi"><small>Subtotal</small><b>${rp(t.sub)}</b></div><div class="kpi"><small>Diskon</small><b>${rp(t.disc)}</b></div><div class="kpi"><small>Total</small><b class="good">${rp(t.total)}</b></div></div>${method==='cash'?`<label>Uang diterima</label><input type="number" inputmode="numeric" value="${paid}" oninput="paid=this.value;render()"><div class="kpi"><small>Kembalian</small><b>${(+paid||0)>=t.total?rp((+paid||0)-t.total):'<span class="bad">Uang kurang</span>'}</b></div>`:''}<div class="actions" style="margin-top:8px"><button onclick="completeSale()">💾 Simpan Transaksi</button><button class="secondary" onclick="clearCart()">Kosongkan</button></div></div>`}
function drawProducts(){let e=$('#products');if(!e)return;let q=search.toLowerCase();let a=db.products.filter(p=>(p.name+' '+p.barcode+' '+p.category).toLowerCase().includes(q));e.innerHTML=a.length?a.map(p=>`<button class="product" onclick="addCart('${p.id}')">${cart[p.id]?`<span class="badge">${cart[p.id]}</span>`:''}<div class="pic">${p.img?`<img src="${p.img}">`:'📦'}</div><b>${esc(p.name)}</b><br><small>${rp(p.sell)} · stok ${p.stock} ${esc(p.unit)}</small>${p.barcode?`<br><span class="pill">${esc(p.barcode)}</span>`:''}</button>`).join(''):'<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan.</div>'}
function scanEnter(){let v=search.trim();let p=db.products.find(p=>p.barcode===v);if(p){addCart(p.id);search=''}else toast('Barcode tidak ditemukan')}
function addCart(id){let p=product(id);if(!p||p.stock<1)return toast('Stok habis');let n=(cart[id]||0)+1;if(n>p.stock)return toast('Stok hanya '+p.stock);cart[id]=n;render()}
function changeQty(id,d){let n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n<=product(id).stock)cart[id]=n;else return toast('Stok tidak cukup');render()}
function clearCart(){cart={};buyer='';paid='';discount=0;render()}
function completeSale(){let {sub,disc,total}=totals();let ids=Object.keys(cart);if(!ids.length)return toast('Keranjang kosong');if(method==='credit'&&!buyer.trim())return toast('Nama pembeli wajib untuk kasbon');let given=method==='cash'?(+paid||0):0;if(method==='cash'&&given<total)return toast('Uang diterima kurang');let items=ids.map(id=>{let p=product(id);return{id,name:p.name,q:cart[id],buy:p.buy,sell:p.sell,barcode:p.barcode,unit:p.unit}});if(items.some(i=>i.q>product(i.id).stock))return toast('Stok berubah, cek kembali');items.forEach(i=>product(i.id).stock-=i.q);let s={id:uid(),t:now(),buyer:buyer.trim(),items,subtotal:sub,discount:disc,total,method,paid:method==='cash'?total:0,given,change:method==='cash'?given-total:0,debt:method==='credit'?total:0,cancelled:false,returned:[]};db.sales.unshift(s);db.moves.unshift({id:uid(),t:now(),type:'sale',ref:s.id,items:items.map(i=>({id:i.id,q:-i.q}))});if(method==='cash')db.kas.unshift({id:uid(),t:now(),type:'sale',amount:total,note:'Penjualan '+s.id});save();clearCart();showReceipt(s)}
function showReceipt(s){modal(`<h3>Struk ${esc(s.id)}</h3><pre>${esc(receiptText(s))}</pre><div class="actions"><button onclick="window.print()">🖨️ Cetak</button><button class="secondary" onclick="shareWA('${s.id}')">WhatsApp</button><button class="ghost" onclick="closeModal()">Tutup</button></div>`)}
function receiptText(s){return [db.shop,new Date(s.t).toLocaleString('id-ID'),'--------------------------------',...s.items.map(i=>`${i.name}\n${i.q} ${i.unit} x ${rp(i.sell)} = ${rp(i.q*i.sell)}`),'--------------------------------',`Subtotal : ${rp(s.subtotal)}`,`Diskon   : ${rp(s.discount)}`,`TOTAL    : ${rp(s.total)}`,s.method==='cash'?`Bayar    : ${rp(s.given)}\nKembali  : ${rp(s.change)}`:`KASBON   : ${rp(s.debt)}`,s.buyer?`Pembeli  : ${s.buyer}`:''].filter(Boolean).join('\n')}
function shareWA(id){let s=db.sales.find(x=>x.id===id);location.href='https://wa.me/?text='+encodeURIComponent(receiptText(s))}
function stok(){return `<div class="actions"><button onclick="productForm()">＋ Produk</button><button class="secondary" onclick="stockInForm()">📥 Stok Masuk</button><button class="secondary" onclick="opnameForm()">📋 Opname</button><button class="secondary" onclick="movesForm()">↔ Mutasi</button></div><input placeholder="Cari produk / barcode / kategori" oninput="stockSearch=this.value;render()"><div>${db.products.map(p=>`<div class="row"><div class="pic" style="height:45px;width:45px">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:'📦'}</div><div class="g"><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category)} · ${rp(p.buy)} → ${rp(p.sell)} · ${esc(p.unit)}</span><br>${p.barcode?`<span class="pill">${esc(p.barcode)}</span>`:''} ${p.supplier?`<span class="pill">${esc(p.supplier)}</span>`:''}</div><b class="${p.stock<=p.min?'bad':'good'}">${p.stock}</b><button class="secondary" onclick="productForm('${p.id}')">Edit</button></div>`).join('')}</div>`}
let stockSearch='';
function productForm(id){let p=id?product(id):{name:'',buy:0,sell:0,stock:0,min:0,category:'Umum',barcode:'',unit:'pcs',supplier:'',img:''};modal(`<button class="closex" onclick="closeModal()">×</button><h3>${id?'Edit':'Tambah'} Produk</h3><div class="two"><div><label>Nama</label><input id="pn" value="${esc(p.name)}"></div><div><label>Kategori</label><input id="pc" value="${esc(p.category)}"></div></div><div class="two"><div><label>Harga beli</label><input id="pb" type="number" value="${p.buy}"></div><div><label>Harga jual</label><input id="ps" type="number" value="${p.sell}"></div></div><div class="three"><div><label>Stok</label><input id="pt" type="number" value="${p.stock}"></div><div><label>Min stok</label><input id="pm" type="number" value="${p.min}"></div><div><label>Satuan</label><input id="pu" value="${esc(p.unit)}"></div></div><div class="two"><div><label>Barcode</label><input id="pbar" value="${esc(p.barcode)}"></div><div><label>Supplier</label><input id="psup" value="${esc(p.supplier)}"></div></div><label>Foto produk</label><input id="pimg" type="file" accept="image/*"><div class="actions"><button onclick="saveProduct('${id||''}')">Simpan</button>${id?`<button class="danger" onclick="deleteProduct('${id}')">Hapus</button>`:''}<button class="ghost" onclick="closeModal()">Batal</button></div>`)}
function fitImg(file,cb){let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let m=640,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.onerror=()=>cb(r.result);im.src=r.result};r.readAsDataURL(file)}
function saveProduct(id){let n=$('#pn').value.trim(),buy=+$('#pb').value||0,sell=+$('#ps').value||0;if(!n)return toast('Nama wajib');if(sell<buy)return toast('Harga jual < harga beli');let old=id?product(id):null;let o={id:id||uid(),name:n,buy,sell,stock:Math.max(0,+$('#pt').value||0),min:Math.max(0,+$('#pm').value||0),category:$('#pc').value.trim()||'Umum',barcode:$('#pbar').value.trim(),unit:$('#pu').value.trim()||'pcs',supplier:$('#psup').value.trim(),img:old?.img||''};let f=$('#pimg').files[0];if(f){fitImg(f,d=>{o.img=d;commitProduct(o,!!id)})}else commitProduct(o,!!id)}
function commitProduct(o,editing){let i=db.products.findIndex(p=>p.id===o.id);if(i<0)db.products.push(o);else db.products[i]=o;save();closeModal();render();toast(editing?'Produk diperbarui':'Produk ditambahkan')}
function deleteProduct(id){if(!confirm('Hapus produk?'))return;db.products=db.products.filter(p=>p.id!==id);save();closeModal();render()}
function stockInForm(){modal(`<h3>Stok Masuk</h3><label>Produk</label><select id="si">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — stok ${p.stock}</option>`).join('')}</select><label>Jumlah masuk</label><input id="sq" type="number" min="1" value="1"><label>Catatan</label><input id="sn" placeholder="Supplier / pembelian"><button onclick="stockIn()">Simpan Stok Masuk</button>`)}
function stockIn(){let p=product($('#si').value),q=Math.max(1,+$('#sq').value||0);if(!p)return; p.stock+=q;db.moves.unshift({id:uid(),t:now(),type:'in',ref:p.id,q,note:$('#sn').value});save();closeModal();render()}
function opnameForm(){modal(`<h3>Stock Opname</h3>${db.products.map(p=>`<div class="row"><div class="g"><b>${esc(p.name)}</b><br><small>stok sistem: ${p.stock}</small></div><input id="op_${p.id}" type="number" min="0" value="${p.stock}" style="max-width:120px"></div>`).join('')}<button onclick="opname()">Simpan Opname</button>`)}
function opname(){db.products.forEach(p=>{let e=$('#op_'+p.id);if(!e)return;let n=Math.max(0,+e.value||0),d=n-p.stock;if(d)db.moves.unshift({id:uid(),t:now(),type:'opname',ref:p.id,q:d,note:'Stock opname'});p.stock=n});save();closeModal();render();toast('Opname disimpan')}
function movesForm(){let a=db.moves.slice(0,100);modal(`<h3>Mutasi Stok</h3>${a.length?a.map(m=>{let p=product(m.ref);return `<div class="row"><div class="g"><b>${esc(p?.name||m.ref)}</b><br><small>${new Date(m.t).toLocaleString('id-ID')} · ${m.type}</small></div><b>${m.q??(m.items?.reduce((x,i)=>x+i.q,0)||0)}</b></div>`}).join(''):'<div class="empty">Belum ada mutasi</div>'}<button class="ghost" onclick="closeModal()">Tutup</button>`)}
function kasbon(){let names={};db.sales.filter(s=>s.method==='credit'&&!s.cancelled).forEach(s=>{let k=s.buyer.trim().toLowerCase();if(k)names[k]=s.buyer});let a=Object.entries(names).map(([k,n])=>({n,d:Math.max(0,debtOf(n))})).filter(x=>x.d>0);return `<div class="kpi"><small>Total piutang</small><b class="bad">${rp(a.reduce((x,y)=>x+y.d,0))}</b></div>${a.length?a.map(x=>`<div class="row"><div class="g"><b>${esc(x.n)}</b><br><span class="bad">${rp(x.d)}</span></div><button onclick="payDebt('${encodeURIComponent(x.n)}')">Bayar</button><a class="btn secondary" href="https://wa.me/?text=${encodeURIComponent(db.shop+' — '+x.n+' sisa kasbon '+rp(x.d))}">WA</a></div>`).join(''):'<div class="empty">Tidak ada kasbon aktif.</div>'}`}
function payDebt(n){n=decodeURIComponent(n);let d=debtOf(n);modal(`<h3>Bayar Kasbon — ${esc(n)}</h3><p>Sisa: <b>${rp(d)}</b></p><input id="payamt" type="number" value="${d}"><button onclick="saveDebt('${encodeURIComponent(n)}')">Simpan Pembayaran</button>`)}
function saveDebt(n){n=decodeURIComponent(n);let a=Math.min(debtOf(n),Math.max(0,+$('#payamt').value||0));if(!a)return;db.pays.unshift({id:uid(),t:now(),buyer:n,amt:a});db.kas.unshift({id:uid(),t:now(),type:'credit_payment',amount:a,note:'Pembayaran kasbon '+n});save();closeModal();render()}
function riwayat(){let a=db.sales.filter(s=>{let ok=historyFilter==='all'||(historyFilter==='cancel'&&s.cancelled)||(historyFilter==='cash'&&s.method==='cash'&&!s.cancelled)||(historyFilter==='credit'&&s.method==='credit'&&!s.cancelled);let q=historySearch.toLowerCase();return ok&&(!q||(s.id+' '+s.buyer+' '+s.items.map(i=>i.name).join(' ')).toLowerCase().includes(q))});return `<div class="two"><input placeholder="Cari transaksi" value="${esc(historySearch)}" oninput="historySearch=this.value;render()"><select onchange="historyFilter=this.value;render()"><option value="all">Semua</option><option value="cash">Cash</option><option value="credit">Kasbon</option><option value="cancel">Batal</option></select></div>${a.slice(0,150).map(s=>`<div class="row"><div class="g"><b>${esc(s.id)}</b> <span class="pill">${s.cancelled?'BATAL':s.method==='credit'?'KASBON':'CASH'}</span><br><small>${new Date(s.t).toLocaleString('id-ID')} · ${esc(s.buyer||'Umum')}</small></div><b>${rp(s.total)}</b><button class="secondary" onclick="saleDetail('${s.id}')">Detail</button></div>`).join('')}`}
function saleDetail(id){let s=db.sales.find(x=>x.id===id);if(!s)return;modal(`<h3>Transaksi ${esc(s.id)}</h3><pre>${esc(receiptText(s))}</pre><div class="actions">${!s.cancelled?`<button class="warn" onclick="cancelSale('${id}')">Batalkan</button><button class="secondary" onclick="returnSale('${id}')">Retur</button>`:''}<button onclick="window.print()">Cetak</button><button class="ghost" onclick="closeModal()">Tutup</button></div>`)}
function cancelSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.cancelled)return;if(!confirm('Batalkan transaksi dan kembalikan stok?'))return;s.cancelled=true;s.items.forEach(i=>product(i.id).stock+=i.q);db.moves.unshift({id:uid(),t:now(),type:'cancel',ref:id,items:s.items.map(i=>({id:i.id,q:i.q}))});if(s.method==='cash')db.kas.unshift({id:uid(),t:now(),type:'cancel',amount:-s.total,note:'Pembatalan '+id});save();closeModal();render()}
function returnSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.cancelled)return;modal(`<h3>Retur — ${esc(id)}</h3>${s.items.map(i=>`<div class="row"><div class="g">${esc(i.name)}<br><small>terjual ${i.q}</small></div><input id="ret_${i.id}" type="number" min="0" max="${i.q-(s.returned?.find(r=>r.id===i.id)?.q||0)}" value="0" style="max-width:100px"></div>`).join('')}<button onclick="saveReturn('${id}')">Proses Retur</button>`)}
function saveReturn(id){let s=db.sales.find(x=>x.id===id),ret=[];s.items.forEach(i=>{let q=Math.max(0,+($('#ret_'+i.id)?.value||0));if(q){product(i.id).stock+=q;ret.push({id:i.id,q})}});if(!ret.length)return toast('Tidak ada barang retur');s.returned=s.returned||[];ret.forEach(r=>{let old=s.returned.find(x=>x.id===r.id);if(old)old.q+=r.q;else s.returned.push(r)});let amount=ret.reduce((a,r)=>{let i=s.items.find(x=>x.id===r.id);return a+r.q*i.sell},0);s.total=Math.max(0,s.total-amount);s.debt=s.method==='credit'?Math.max(0,s.debt-amount):s.debt;db.moves.unshift({id:uid(),t:now(),type:'return',ref:id,items:ret});save();closeModal();render();toast('Retur berhasil')}
function laporan(){let end=now(),start=new Date();if(reportRange==='day')start.setHours(0,0,0,0);if(reportRange==='week'){let d=start.getDay()||7;start.setDate(start.getDate()-d+1);start.setHours(0,0,0,0)}if(reportRange==='month'){start.setDate(1);start.setHours(0,0,0,0)}let S=db.sales.filter(s=>s.t>=start.getTime()&&s.t<=end&&!s.cancelled),rev=S.reduce((a,s)=>a+s.total,0),cogs=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.q*i.buy,0),0),profit=rev-cogs,credit=S.filter(s=>s.method==='credit').reduce((a,s)=>a+s.total,0),cash=S.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0),inv=db.products.reduce((a,p)=>a+p.stock*p.buy,0),receiv=db.sales.filter(s=>s.method==='credit'&&!s.cancelled).reduce((a,s)=>a+s.debt,0)-db.pays.reduce((a,p)=>a+p.amt,0);let top={};S.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));return `<div class="tabs">${['day','week','month'].map(x=>`<button class="${reportRange===x?'active':''}" onclick="reportRange='${x}';render()">${x==='day'?'Hari ini':x==='week'?'Minggu':'Bulan'}</button>`).join('')}</div><div class="grid3"><div class="kpi"><small>Omzet</small><b>${rp(rev)}</b></div><div class="kpi"><small>Modal</small><b>${rp(cogs)}</b></div><div class="kpi"><small>Laba</small><b class="good">${rp(profit)}</b></div><div class="kpi"><small>Transaksi</small><b>${S.length}</b></div><div class="kpi"><small>Cash</small><b>${rp(cash)}</b></div><div class="kpi"><small>Kasbon baru</small><b>${rp(credit)}</b></div><div class="kpi"><small>Nilai stok</small><b>${rp(inv)}</b></div><div class="kpi"><small>Piutang</small><b>${rp(Math.max(0,receiv))}</b></div><div class="kpi"><small>Stok menipis</small><b class="${db.products.filter(p=>p.stock<=p.min).length?'bad':''}">${db.products.filter(p=>p.stock<=p.min).length}</b></div></div><div class="card"><b>Produk terlaris</b>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div class="row"><div class="g">${esc(x[0])}</div><b>${x[1]}</b></div>`).join('')||'<div class="empty">Belum ada transaksi</div>'}</div><div class="card"><b>Kas</b><p>Saldo kas: <strong>${rp(db.kas.reduce((a,k)=>a+(+k.amount||0),0))}</strong></p><button onclick="cashForm('in')">Kas Masuk</button> <button class="warn" onclick="cashForm('out')">Kas Keluar</button></div>`}
function cashForm(type){modal(`<h3>${type==='in'?'Kas Masuk':'Kas Keluar'}</h3><input id="cashamt" type="number" min="0"><input id="cashnote" placeholder="Catatan"><button onclick="saveCash('${type}')">Simpan</button>`)}
function saveCash(type){let a=Math.max(0,+$('#cashamt').value||0);if(!a)return;db.kas.unshift({id:uid(),t:now(),type,amount:type==='in'?a:-a,note:$('#cashnote').value});save();closeModal();render()}
function setelan(){return `<div class="card"><label>Nama warung</label><input value="${esc(db.shop)}" onchange="db.shop=this.value.trim()||'Warung Saya';save();render()"><label>Tema</label><select onchange="setTheme(this.value)"><option value="dark" ${db.settings.dark?'selected':''}>Gelap</option><option value="light" ${!db.settings.dark?'selected':''}>Terang</option></select><label>Auto-lock (menit, 0 = mati)</label><input type="number" min="0" value="${db.settings.lockMinutes}" onchange="db.settings.lockMinutes=Math.max(0,+this.value||0);save()"></div><div class="card"><h3>Keamanan PIN</h3><p class="muted">PIN saat ini wajib diubah dari PIN awal sebelum dipakai serius.</p><div class="two"><input id="newpin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN baru"><input id="newpin2" type="password" inputmode="numeric" maxlength="6" placeholder="Ulangi PIN"></div><button onclick="changePin()">Ubah PIN</button></div><div class="card"><h3>Backup & Restore</h3><div class="actions"><button onclick="downloadBackup()">⬇️ Backup JSON</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">⬆️ Restore JSON</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restoreFile(this)"><button class="ghost" onclick="copyBackup()">Salin JSON</button></div></div><div class="card"><h3>Data</h3><p>${db.products.length} produk · ${db.sales.length} transaksi · ${db.pays.length} pembayaran</p><button class="danger" onclick="resetData()">Reset Semua Data</button></div>`}
function setTheme(v){db.settings.dark=v==='dark';document.documentElement.dataset.theme=v;save();render()}
function changePin(){let a=$('#newpin').value,b=$('#newpin2').value;if(!/^\d{4,6}$/.test(a)||a!==b)return toast('PIN 4–6 digit dan harus sama');db.pin=a;save();toast('PIN diubah')}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Kasir_Ultimate_Backup_'+ymd(now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function copyBackup(){navigator.clipboard?.writeText(JSON.stringify(db)).then(()=>toast('Backup disalin')).catch(()=>toast('Clipboard tidak tersedia'))}
function restoreFile(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.products)||!Array.isArray(o.sales))throw 0;db=normalize(o);save();render();toast('Restore berhasil')}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}
function resetData(){if(!confirm('RESET semua data?'))return;db=normalize(base);save();cart={};render();toast('Data direset')}
function modal(h){$('#modal').innerHTML=h?`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`:''}function closeModal(){$('#modal').innerHTML=''}
function quickLock(){if(db.pin)lock()}
function lock(){$('#lock').classList.remove('hidden');$('#pinIn').value='';setTimeout(()=>$('#pinIn').focus(),50)}
function unlock(){if($('#pinIn').value===db.pin){$('#lock').classList.add('hidden');$('#pinErr').textContent='';touch()}else $('#pinErr').textContent='PIN salah'}
let lastTouch=now();function touch(){lastTouch=now()}['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,touch,{passive:true}));setInterval(()=>{if(db.settings.lockMinutes>0&&$('#lock').classList.contains('hidden')&&now()-lastTouch>db.settings.lockMinutes*60000)lock()},15000);
function init(){document.documentElement.dataset.theme=db.settings.dark?'dark':'light';render();if(db.pin==='1234')toast('PIN awal: 1234 — segera ubah di Setelan');}
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
window.addEventListener('offline',()=>toast('Mode offline — data tetap tersimpan di perangkat'));
window.addEventListener('online',()=>toast('Kembali online'));
init();
</script></body></html>
